server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SMTP_USE_TLS:true}
  thymeleaf:
    cache: true

# --- Платёжный слой ---
payment:
  mode: ${PAYMENT_MODE:mock}
  webhook-secret: ${ROLLYPAY_SIGNING_SECRET:cringe-super-secret-key-2024}
  pay-base-url: ${PUBLIC_PAY_BASE_URL:http://localhost:8080}
  # Внешний URL (для документации/публичных нужд)
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/payments/webhook}
  # ВНУТРЕННИЙ URL для self-вебхука: контейнер вызывает себя через localhost,
  # а не через публичный домен (иначе цикл через Caddy + потенциальный SSL fail).
  callback-internal-url: ${PAYMENT_CALLBACK_INTERNAL_URL:http://localhost:${SERVER_PORT:8080}/api/payments/webhook}

# --- Музыка ---
music:
  dir: ${MUSIC_DIR:./music}

# --- Почта (чеки) ---
receipt:
  from-email: ${SMTP_FROM_EMAIL:}
  from-name: ${SMTP_FROM_NAME:Cringe Volume Player}

# --- Публичные URL ---
public:
  backend-url: ${PUBLIC_BACKEND_URL:http://localhost:8080}
  pay-url: ${PUBLIC_PAY_BASE_URL:http://localhost:8080}
  web-url: ${PUBLIC_WEB_URL:http://localhost:8080}
