<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cringe Volume Player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="header">
    <h1>🎵 Cringe Volume Player</h1>
    <p>Каждое изменение громкости стоит денег</p>
</div>

<div class="container">

    <!-- Треки -->
    <div class="card">
        <h2>📂 Библиотека треков
            <button class="btn btn-sm btn-outline" onclick="loadTracks()" style="float:right;font-size:11px;padding:4px 10px">🔄</button>
        </h2>
        <div class="track-list" id="trackList">
            <div class="empty-msg">Загрузка...</div>
        </div>
        <div class="upload-area">
            <label for="uploadFile">📤 Загрузить трек (.mp3 / .wav)</label>
            <input type="file" id="uploadFile" accept=".mp3,.wav,audio/mpeg,audio/wav"/>
        </div>
    </div>

    <!-- Кастомный плеер БЕЗ ползунка громкости -->
    <div class="card">
        <h2>🎧 Плеер</h2>
        <div class="player-section">
            <div class="now-playing" id="nowPlaying">Выберите трек из списка</div>

            <!-- скрытый <audio> — управляется через JS, без видимых controls,
                 чтобы пользователь НЕ мог обойти платную регулировку громкости -->
            <audio id="audioPlayer" preload="metadata"
                   controlsList="nodownload noplaybackrate"
                   oncontextmenu="return false"></audio>

            <!-- кастомные элементы управления: play/pause + seek, БЕЗ volume -->
            <div class="custom-player">
                <button class="play-btn" id="playPauseBtn" onclick="togglePlay()" disabled>▶</button>
                <div class="time-display" id="currentTime">0:00</div>
                <input type="range" id="seekBar" class="seek-bar"
                       min="0" max="0" step="0.1" value="0"
                       oninput="onSeek(this.value)" disabled/>
                <div class="time-display" id="duration">0:00</div>
            </div>
        </div>
    </div>

    <!-- Громкость (платная — единственный способ изменить громкость) -->
    <div class="card">
        <h2>💰 Громкость (платная)</h2>
        <div class="current-volume">
            Текущая: <strong id="currentVolume">50%</strong>
        </div>
        <div class="volume-row">
            <span class="volume-label">Новая громкость:</span>
            <input type="number" id="volumeInput" min="0" max="100" value="50" step="1"/>
            <span class="volume-label">%</span>
            <button class="btn btn-accent btn-sm" onclick="applyVolume()" style="margin-left:auto">
                💳 Изменить
            </button>
        </div>
    </div>

    <!-- Статус -->
    <div class="status-bar" id="statusBar">Загрузка...</div>
</div>

<!-- Payment modal -->
<div class="modal-backdrop" id="paymentModal">
    <div class="modal">
        <h3 id="modalTitle">Оплата</h3>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-price" id="modalPrice"></div>
        <div class="price-detail" id="modalPriceDetail"></div>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<div class="footer">
    Cringe Volume Player &copy; 2024 &mdash; демонстрационный проект
</div>

<script src="app.js"></script>
</body>
</html>
